<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <title>Sem conexão - Área do Técnico</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
               font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); color: #2d3436; }
        .caixa { background: #fff; border-radius: 16px; padding: 28px 24px; max-width: 380px; text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
        h1 { font-size: 20px; margin: 12px 0 8px; }
        p { color: #636e72; line-height: 1.5; font-size: 15px; }
        button { margin-top: 10px; background: #667eea; color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; font-size: 15px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="caixa">
        <img src="icone-192.png" alt="" width="72" height="72">
        <h1>Sem conexão com a internet</h1>
        <p>Esta tela ainda não foi aberta neste aparelho, por isso não está disponível offline.</p>
        <p>As telas que você já abriu (lista de OS e OS visitadas) continuam funcionando, e o que você registrar fica guardado até a conexão voltar.</p>
        <button type="button" onclick="history.back()">Voltar</button>
        <button type="button" onclick="location.reload()">Tentar de novo</button>
    </div>
</body>
</html>

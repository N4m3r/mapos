; PHP Configuration

[Date]
date.timezone = America/Sao_Paulo

; Error handling
display_errors = Off
log_errors = On
memory_limit = 256M
max_execution_time = 600

; PHP2Shell (CVE-2026-109619): bloqueia o vetor via upload progress.
; Mitigacao parcial - a correcao real e usar PHP >= 8.3.36 / 8.2.35.
session.upload_progress.enabled = Off

[opcache]
; Cache de bytecode. validate_timestamps fica ligado porque o codigo e montado
; como volume: alteracoes nos .php sao detectadas em ate 2 segundos.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Xdebug
; See https://xdebug.org/docs/all_settings

;PHPStorm
; [Xdebug]
; xdebug.remote_enable=1
; xdebug.idekey=PHPSTORM
; xdebug.profiler_enable=0
; xdebug.max_nesting_level=700
; xdebug.remote_host=192.168.0.1 # your ip
; xdebug.remote_port=9000

;Netbeans
;[Xdebug]
;xdebug.remote_enable=1
;xdebug.remote_handler=dbgp
;xdebug.remote_mode=req
;xdebug.remote_host=192.168.0.1 # your ip
;xdebug.remote_port=9000

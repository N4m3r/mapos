name: "Testes"

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unidade:
    name: Sintaxe, auditoria e PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, mbstring, soap, zip, intl
          coverage: none

      - name: Instalar dependencias (composer.lock)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Sintaxe de todos os arquivos PHP
        run: find application assets install index.php -path application/vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Vulnerabilidades conhecidas nas dependencias
        run: composer audit --no-interaction

      - name: PHPUnit
        run: application/vendor/bin/phpunit

  smoke:
    name: Smoke test (login e telas principais)
    runs-on: ubuntu-latest
    services:
      mysql:
        # mesma versao do docker/docker-compose.yml
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, gd, mbstring, soap, zip, intl, mysqli
          coverage: none

      - name: Instalar dependencias (composer.lock)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Instalar o Map-OS num banco vazio
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: root
          DB_NAME: mapos_ci
          BASE_URL: http://localhost:8099/
        run: sh tests/smoke/instalar.sh

      - name: Subir o servidor
        # Varios workers: os relatorios em PDF buscam imagens no proprio servidor
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8099 > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:8099/robots.txt && break; sleep 1; done

      - name: Smoke test
        env:
          BASE_URL: http://localhost:8099/index.php
          EMAIL: admin@mapos.test
          SENHA: admin123
        run: sh tests/smoke/smoke.sh

      - name: PDV (abrir caixa, vender, recusas, sangria, fechar)
        env:
          BASE_URL: http://localhost:8099/index.php
          EMAIL: admin@mapos.test
          SENHA: admin123
        run: |
          mysql --protocol=TCP -h127.0.0.1 -uroot -proot mapos_ci -e "INSERT INTO produtos (idProdutos, descricao, unidade, precoCompra, precoVenda, estoque, estoqueMinimo) VALUES (1, 'Produto smoke', 'UN', 5, 25, 100, 0)"
          sh tests/smoke/pdv.sh

      - name: Node para os testes de navegador
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testes de navegador (Chrome; CSP bloqueando, data-*, PDV)
        env:
          BASE_URL: http://localhost:8099/
          EMAIL: admin@mapos.test
          SENHA: admin123
        run: |
          cd tests/navegador
          npm install --no-audit --no-fund
          CHROME="$(command -v google-chrome || command -v chromium)" node telas.mjs

      - name: Acompanhamento publico da OS + NPS (Chrome)
        env:
          BASE_URL: http://localhost:8099/
          EMAIL: admin@mapos.test
          SENHA: admin123
        run: |
          Q="mysql --protocol=TCP -h127.0.0.1 -uroot -proot -N mapos_ci"
          $Q -e "INSERT INTO clientes (nomeCliente, documento, telefone, email, senha) VALUES ('Cliente smoke', '', '', '', ''); INSERT INTO os (dataInicial, dataFinal, status, clientes_id, usuarios_id, faturado, descricaoProduto) VALUES (CURDATE(), CURDATE(), 'Finalizado', LAST_INSERT_ID(), 1, 0, 'Teste')"
          export OS_ID=$($Q -e "SELECT MAX(idOs) FROM os")
          cd tests/navegador
          CHROME="$(command -v google-chrome || command -v chromium)" node acompanhar.mjs

      - name: Relatorio de cobranca (Chrome)
        env:
          BASE_URL: http://localhost:8099/
          EMAIL: admin@mapos.test
          SENHA: admin123
        run: |
          cd tests/navegador
          CHROME="$(command -v google-chrome || command -v chromium)" node cobranca.mjs

      - name: Backup automatico (linha de comando)
        run: |
          php index.php backup/executar
          unzip -p "$(ls -t application/backups/backup_*.zip | head -1)" | grep -q "CREATE TABLE"

      - name: Lembretes ao cliente (simulacao)
        run: php index.php lembretes/executar simular

      - name: Log do servidor e da aplicacao (em caso de falha)
        if: failure()
        run: |
          tail -n 100 /tmp/php-server.log || true
          tail -n 100 application/logs/*.php 2>/dev/null || true
